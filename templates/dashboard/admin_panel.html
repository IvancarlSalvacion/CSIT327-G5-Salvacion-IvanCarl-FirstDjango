{% extends "base.html" %}
{% block title %}Admin Panel{% endblock %}
{% block content %}
<div class="d-flex align-items-start justify-content-between gap-3 mb-4">
	<div>
		<span class="page-kicker">CampusConnect</span>
		<h1 class="h2 mt-2 mb-1">Admin panel</h1>
		<p class="text-secondary mb-0">Administration overview.</p>
	</div>
	<a class="btn btn-outline-secondary" href="{% url 'dashboard' %}"><i class="bi bi-arrow-left me-2"></i>Back to home</a>
</div>
<div class="surface p-4">
	<div class="d-flex align-items-center gap-3">
		<span class="d-inline-flex align-items-center justify-content-center rounded-circle text-brand" style="width: 44px; height: 44px; background: #e7efe8;"><i class="bi bi-people fs-5"></i></span>
		<div><div class="text-secondary small">Registered members</div><div class="h4 mb-0">{{ member_count }}</div></div>
	</div>
</div>
{% endblock %}
